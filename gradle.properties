org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# --- FITNEX configuration -------------------------------------------------
# Secure FITNEX backend URL (Cloud Run / Cloud Functions). The Gemini key
# NEVER lives in the APK: it is stored only on the server (Secret Manager).
# Override locally in ~/.gradle/gradle.properties or with -Pfitnex.backendUrl=...
fitnex.backendUrl=https://fitnex-api.fitnex-api-worker.workers.dev/
